name: CI

on:
  pull_request:
    branches:
      - main
      - feature/dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Svelte check
        run: bun run check

      - name: Run unit tests
        run: bun run test

      - name: Build production
        run: bun run build

      - name: Check bundle size
        run: bunx bundlesize2 --config .github/bundlesize.config.json
